# The plug-in's Rust side, which cmake/HadronycheRust.cmake in the library builds into the plug-in. The plug-in's
# version is in CMakeLists.txt, so this one is left at nothing.

[package]
name = "partialresynth"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib", "lib"]

[dependencies]
hadronyche-dsp = { path = "../external/hadronychecore/rust/hadronyche-dsp" }
hadronyche-plugin = { path = "../external/hadronychecore/rust/hadronyche-plugin" }

[dev-dependencies]
# Pure Data's original fiddle~, for the tests to compare the port with. Only the tests build it.
reference-fiddle = { path = "reference-fiddle" }

[workspace]
members = ["reference-fiddle"]

# A Debug plug-in has to keep up with real time too.
[profile.dev]
opt-level = 1

[profile.release]
codegen-units = 1
lto = true
