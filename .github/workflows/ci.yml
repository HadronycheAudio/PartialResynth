# Every Hadronyche plug-in's CI is the same, so it lives in HadronycheCore's .github/workflows/plugin-ci.yml. The commit
# in `uses:` is the one that `external/hadronychecore` points at, and moves with it.
name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  ci:
    uses: HadronycheAudio/HadronycheCore/.github/workflows/plugin-ci.yml@6984a27a384914977cc9c767f0860b19b8a8f0af
    # The release job needs write, and the others take read.
    permissions:
      contents: write
    with:
      name: PartialResynth
      au_type: aufx
      au_subtype: PrRs
      extra_licenses: Pure-Data-LICENSE.txt
